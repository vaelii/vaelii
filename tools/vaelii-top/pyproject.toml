[project]
name = "vaelii-top"
version = "0.1.0"
description = "The vaelii checkout in a btop-style terminal UI: status, git history, and which revision each check last ran at."
requires-python = ">=3.9"
dependencies = [
    "textual>=0.60",
]

[project.scripts]
vaelii-top = "vtop.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# `lein lint`'s tools stage (scripts/lint-tools.sh) runs ruff, which reads this
# table by walking up from each file.  py39 is the floor the UI is written to:
# the checkout's own .venv is 3.9 and the code takes `from __future__ import
# annotations` rather than PEP 604 unions.
[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# The default set (pycodestyle errors, pyflakes) plus the four that catch what
# review misses in a terminal UI: an unused local, a mutable default, a bare
# `except`, and an import that moved.
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
# theme.py is jstacks' drawing code with two fields renamed, and its header says
# a fix to an edge or a meter belongs in both trees.  Rewriting its imports
# (UP035, typing.Iterable → collections.abc) would make the two files differ by
# a line no fix went through, so the diff stops being readable.  Change it there
# first, then copy.
"src/vtop/theme.py" = ["UP035"]
