name: perf

# The perf-ab probes a pull request's change reaches, timed on the pull request before it
# merges.
#
# perf-ab times fixed workloads (bench/vaelii/bench/ab.clj) in absolute milliseconds: the
# base and the change in alternating JVMs on one runner, so the runner's speed divides
# out of each pair.  `perf-ab` judges the pairs of three reps together and fails a probe
# whose median ratio passes 1.25x (scripts/perf-ab.sh).  It reads a cost added to every
# operation: vaelii#190 took `vaelii.starter/load-into` from 9.7 s to 28.2 s on one
# machine, and test.yml's memory leg from 45 to 97 minutes of namespace time.
#
# The `lein perf` checks, which judge how a cost grows between two sizes, run in
# deep.yml's weekly perf job and not here.  On two pull requests on 2026-11-21, 312 checks
# took 215 of the runs' 342 runner-minutes, on eight runners each.  On the pull request
# that reverted a fix perf-ab reads at 1.35x to 2.28x, the seven shards that finished
# passed.
#
# `perf-plan` selects the probes through scripts/perf-owed.py and splits them into one
# job per rep and part (scripts/ci-perf-plan.sh states the rule).  A change under
# resources/kb/ owes the starter-load and starter-recover probes.  A change to an engine
# file owes all 16.  A change that reaches no probe runs nothing, and `perf` reports
# success.
#
# `perf` collects the verdicts of the jobs before it, so the workflow reports under one
# check name.  CONTRIBUTING.md §7 states how to read a red one and reproduce it.
#
# Every `uses:` below is a commit SHA with the version in a trailing comment;
# lint.yml's header says why a tag is not good enough here.
#
# The jobs run on vaelii/*, where Actions minutes are free, and on any other copy whose
# repository variable `PERF_CI` is `true`.  A copy whose minutes are billed opts in that
# way; the condition names no account but the public org.
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

# Least privilege: these jobs read the repo and time it.  Nothing is written back and
# no secret is read.  `pull_request`, never `pull_request_target`.
permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request or a dispatch.  A push to develop lands a pull request this workflow
  # timed.  The selection reads git and python only, so this job starts no JVM.
  perf-plan:
    name: perf-plan
    if: (github.repository_owner == 'vaelii' || vars.PERF_CI == 'true') && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.plan.outputs.base }}
      probes: ${{ steps.plan.outputs.probes }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # the whole history, which the selection diffs the base against
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A pull request's checkout is its merge commit, whose first parent is the base
      # branch's tip.  A dispatch times the branch against its merge base with develop.
      - name: Select the probes
        id: plan
        run: |
          set -o pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            *) base=$(git merge-base origin/develop HEAD) ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          scripts/ci-perf-plan.sh "$base" 3 | tee -a "$GITHUB_OUTPUT"
          { echo '```'; python3 scripts/perf-owed.py --base "$base" --why; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

  # One job per rep and part.  An odd rep runs the base first, so the three reps hold
  # both orders.  starter-load runs alone: on the runners its JVM pair took about as long
  # as the other 15 probes' pair.
  perf-ab-rep:
    name: perf-ab-rep-${{ matrix.rep }}-${{ matrix.part }}
    needs: perf-plan
    if: needs.perf-plan.outputs.probes != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.perf-plan.outputs.matrix) }}
    steps:
      # the whole history, which perf-ab archives the base from
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74  # 13.7.0
        with:
          lein: 2.12.0  # 2.13.0's launcher self-installs an unpublished snapshot jar

      - name: Cache Maven deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-jdk25-${{ hashFiles('project.clj') }}
          restore-keys: |
            m2-${{ runner.os }}-jdk25-

      # Exit 1 is one pair over the threshold, which the `perf-ab` job judges with the
      # other reps' pairs.  Exit 2 or 3 is a run that produced no pair.
      - name: Time rep ${{ matrix.rep }} of ${{ matrix.part }} against the base
        env:
          BASE: ${{ needs.perf-plan.outputs.base }}
          PROBES: ${{ matrix.probes }}
          REP: ${{ matrix.rep }}
        run: |
          rc=0
          scripts/perf-ab.sh "$BASE" --reps 1 --first-rep "$REP" --only "$PROBES" || rc=$?
          [ "$rc" -le 1 ]

      - name: Upload the rep's rows and log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: perf-ab-rep-${{ matrix.rep }}-${{ matrix.part }}
          path: logs/perf-ab/
          if-no-files-found: ignore
          retention-days: 7

  perf-ab:
    name: perf-ab
    needs: perf-ab-rep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # one directory per job: two runners can write the same run-<pid>.tsv name
      - name: Download the reps' rows
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: perf-ab-rep-*
          path: target/perf-ab

      # exit 1 names a REGRESSED probe, and exit 2 a job that left no rows
      - name: Judge the three pairs per probe
        run: |
          shopt -s nullglob
          rows=(target/perf-ab/perf-ab-rep-*/run-*.tsv)
          rc=0
          out=$(scripts/perf-ab.sh --judge "${rows[@]}") || rc=$?
          printf '%s\n' "$out"
          { echo '```'; printf '%s\n' "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  perf:
    name: perf
    needs: [perf-plan, perf-ab-rep, perf-ab]
    if: ${{ always() && (github.repository_owner == 'vaelii' || vars.PERF_CI == 'true') && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Every owed probe passed
        env:
          PLAN: ${{ needs.perf-plan.result }}
          REPS: ${{ needs.perf-ab-rep.result }}
          AB: ${{ needs.perf-ab.result }}
        run: |
          [ "$PLAN" = success ] || { echo "perf-plan ended $PLAN"; exit 1; }
          for r in "perf-ab-rep $REPS" "perf-ab $AB"; do
            case "${r#* }" in
              success|skipped) ;;
              *) echo "${r% *} ended ${r#* }"; exit 1 ;;
            esac
          done
