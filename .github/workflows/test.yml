name: test

# The suite, once per RECORD store. Storage is two independent choices
# (docs/storage.md) and there are eight legal record×index pairs plus the
# overlay decorator, but a pull request does not need all nine: the axis a
# change is most likely to break and least likely to notice is DURABILITY, so
# the required checks run the two ends of it — everything in RAM, and everything on disk —
# and deep.yml carries the full matrix. `scripts/test-backends.sh` is the
# same nine runs locally, and anything touching storage, the index, records or
# recovery owes it one before it lands.
#
# The `:default` selector, matching `lein gate`. The `^:slow` tests carry 47%
# of the suite's assertions (CONTRIBUTING.md §5 has the count). This job defers them
# because deep.yml runs `:all`; a tree without deep.yml owes `:all` here.
#
# BOTH LEGS ARE SHARDED ACROSS RUNNER VMs, eight ways each. Separate VMs share
# neither a disk nor a registry, the same reason deep.yml runs nine backends in
# parallel. Shards are whole namespaces (a `:once` fixture is
# what tests in one file share), and `scripts/ci-shard.sh` decides which
# namespaces each shard gets: it packs them by measured time, because an equal
# count of files is not an equal amount of work.
#
# THE WEIGHTS FOLLOW THE SUITE. Each shard records its namespace times
# (scripts/lib/ns-timings.sh), the `weights` job averages a green leg's times
# into the weights the run packed from and saves the result to the Actions cache,
# and the next run's shards pack from the newest such file. `weights-plan` resolves that cache entry once and
# hands every shard the same key, because shards packing from two different files
# would run some namespaces twice and others not at all. With no cache entry the
# shards read the committed scripts/ci-test-weights-<leg>.tsv. In run 38451741321
# the committed weights were four weeks stale and the disk shards took 4m49s to
# 17m12s; repacked eight ways from that run's times, each shard carries 299s.
#
# The shard COUNT is the length of each job's matrix, read back as
# `strategy.job-total`. Both matrices have one dimension, so adding a value to
# `shard:` is the whole of adding a shard.
#
# Hermetic: no external service and no network call.
#
# Every `uses:` below is a commit SHA with the version in a trailing comment;
# lint.yml's header says why a tag is not good enough here.
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

# Least privilege: these jobs read the repo and run the suite. Nothing is
# written back and no secret is read, so a fork's pull request runs the whole
# thing — which is the point. `pull_request`, never `pull_request_target`.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The newest cached weights per leg, looked up and not downloaded. The key goes
  # to every shard of the leg, which restores exactly that entry. A lookup that
  # fails leaves the key empty and the shards on the committed files, so the cache
  # service being down never stops the required checks.
  weights-plan:
    name: weights-plan
    if: github.event_name != 'schedule' || github.repository_owner == 'vaelii'
    runs-on: ubuntu-latest
    outputs:
      memory: ${{ steps.memory.outputs.cache-matched-key }}
      disk: ${{ steps.disk.outputs.cache-matched-key }}
    steps:
      - id: memory
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/ci-weights/memory.tsv
          key: ci-weights-memory-${{ github.run_id }}
          restore-keys: ci-weights-memory-
          lookup-only: true
      - id: disk
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/ci-weights/disk.tsv
          key: ci-weights-disk-${{ github.run_id }}
          restore-keys: ci-weights-disk-
          lookup-only: true

  # The in-RAM end of the durability axis, split across eight runner VMs, each
  # reporting under its own name and all eight collected by the `memory` job below.
  #
  # `memory` and `disk` are REQUIRED checks on `develop`, and what makes that
  # safe is that this workflow carries no path filter: it runs on every pull
  # request, so both required checks always report. DO NOT ADD A `paths-ignore` here. A
  # workflow skipped by a path filter never reports at all — not as passed,
  # not as skipped — so a required check that names it leaves every pull
  # request the filter matched unmergeable forever. The two are one decision.
  #
  # A doc-only change runs the suite and passes it, because a required check
  # that skips a change reports nothing about it. `docs/**` is not inert with
  # respect to the suite anyway: config_surface_test reads docs/operations.md
  # and holds its configuration table to every switch the tree reads, and
  # scripts/check-doc-drift.py stands aside on that one file because the test
  # covers it.
  memory-shard:
    name: memory-shard-${{ matrix.shard }}
    needs: weights-plan
    # A scheduled run does work only where Actions minutes are free. Push and
    # pull_request are untouched: this job is a required check, and a required
    # check that skips reports nothing. deep.yml carries the long form of the argument.
    if: github.event_name != 'schedule' || github.repository_owner == 'vaelii'
    runs-on: ubuntu-latest
    # A balanced shard is predicted at about 6m: 298s of namespace time in run
    # 38451741321 plus about 80s of setup. The timeout is set from the four-way
    # packing, where runner speed alone moved a shard by half its predicted 11m:
    # over two runs the slowest disk shard took 17m15s and the slowest memory
    # shard 15m51s. 25 minutes is 1.45x the slower of those, so a shard that
    # reaches it has grown, which is a change to investigate rather than a slow
    # runner to wait out.
    timeout-minutes: 25
    strategy:
      # Run every shard to completion: a bug living in one shard's namespaces
      # should not be hidden by another shard going red first.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # No credentials left in .git/config: nothing here pushes, and a token
      # sitting in the workspace is reachable by anything the build runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74  # 13.7.0
        with:
          lein: 2.12.0  # 2.13.0's launcher self-installs an unpublished snapshot jar

      - name: Cache Maven deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2
          # runner OS and JDK in the key: the same project.clj resolves different
          # artifacts on a different platform or Java version, and a bare `m2-`
          # key would serve one leg's ~/.m2 to another the moment a matrix grows.
          key: m2-${{ runner.os }}-jdk25-${{ hashFiles('project.clj') }}
          restore-keys: |
            m2-${{ runner.os }}-jdk25-

      # Exactly the entry weights-plan found, and a miss fails the shard: a shard
      # falling back to the committed file while its siblings read the cache would
      # pack from different weights than they do.
      - name: Restore the cached weights
        if: needs.weights-plan.outputs.memory != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/ci-weights/memory.tsv
          key: ${{ needs.weights-plan.outputs.memory }}
          fail-on-cache-miss: true

      # develop's newest weights, which the `weights` job judges this run against
      # (scripts/ci-weights.sh --check).  A miss reruns nothing.
      - name: Restore develop's weights
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/ci-baseline/
          key: ci-baseline-${{ github.run_id }}
          restore-keys: ci-baseline-

      # The suite owns space numbers 14-15 and clears them; the foreign-reader
      # plugin owns 8-11, which is what lets both run at once on one machine.
      # Nothing is set here because each shard is its own runner VM, so the
      # default block is already unshared — the convention matters to a developer
      # running two suites locally, and `VAELII_TEST_SPACE` is how they move it.
      #
      # A RAM-only run reads no directory and is given no `-D` at all; the
      # disk-log shards below point `vaelii.disk.dir` at scratch space of their
      # own. Same shape as scripts/test-backends.sh, the local spelling of this.
      #
      # `tee` so the run streams into the job log AND leaves a file for the
      # upload below — `lein test` writes no log of its own (`lein gate` is what
      # fills logs/gate/, and this job does not run it). `set -o pipefail` is
      # what keeps the pipe honest: without it the step's status is `tee`'s,
      # which is always 0, so a red suite would report green.
      #
      # `$nss` is unquoted because the shard script prints a namespace per line
      # and `lein test` wants them as separate arguments.
      - name: Run the suite (memory, shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        id: suite
        env:
          VAELII_TEST_BACKEND: memory
        run: |
          set -o pipefail
          mkdir -p target/ci/timings-memory
          w=(); [ -f target/ci-weights/memory.tsv ] && w=(--weights target/ci-weights/memory.tsv)
          nss=$(scripts/ci-shard.sh "${{ matrix.shard }}" "${{ strategy.job-total }}" --leg memory "${w[@]}")
          [ -n "$nss" ]
          # Bare namespace args: the `:default` selector still applies (verified:
          # a ^:slow test in a named namespace is excluded), while spelling the
          # selector out alongside namespace args makes lein ignore the namespace
          # filter and run the whole suite (verified the hard way).
          . scripts/lib/ns-timings.sh
          t="target/ci/timings-memory/${{ matrix.shard }}-of-${{ strategy.job-total }}.tsv"
          log="target/ci/test-memory-shard-${{ matrix.shard }}.log"
          # shellcheck disable=SC2086
          lein test $nss 2>&1 | ns_timings "$t" | tee "$log"
          # A namespace slower than this runner's speed accounts for runs once more,
          # and the smaller of its two times is the one the `weights` job reads
          # (scripts/lib/ns-timings.sh, `ns_timings_rerun`).
          if [ -f target/ci-baseline/memory.tsv ]; then
            slow=$(scripts/ci-weights.sh --from target/ci/timings-memory --leg memory --list target/ci-baseline/memory.tsv) \
              || echo "::warning::scripts/ci-weights.sh --list failed, so no namespace runs again"
            # shellcheck disable=SC2086
            if ns_timings_rerun_fits target/ci-baseline/memory.tsv "$nss" $slow; then
              ns_timings_rerun "$t" $slow | tee -a "$log"
            fi
          fi

      # The log is the answer to "why did it fail", and a red run is exactly when
      # nobody can reproduce it locally. `if: failure()` so a green run uploads
      # nothing; `if-no-files-found: error` because an empty artifact answers
      # nothing and reads as if it had — the step above writes the file, so its
      # absence is a defect in this job rather than a normal outcome.
      #
      # Conditioned on the SUITE step rather than on the job, so a failure in
      # checkout or setup — which never reaches the log — skips the upload
      # instead of failing it a second time for a file that was never written.
      - name: Upload failure logs
        if: failure() && steps.suite.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-memory-shard-${{ matrix.shard }}-logs
          path: target/ci/
          if-no-files-found: error
          retention-days: 7

      # A green shard's namespace times, for the `weights` job. A failed upload
      # costs the next run its balance, not this run its verdict.
      - name: Upload namespace timings
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: timings-memory-${{ matrix.shard }}
          path: target/ci/timings-memory/
          if-no-files-found: error
          retention-days: 1

  # Branch protection on `develop` requires the bare `memory` context, so the
  # shard legs report through this required check rather than under their own names.
  # Branch protection stores the JOB name, so the context is the bare `memory` —
  # the `test / memory` spelling is the pull-request UI's, and typing that into a
  # required-checks list names a check that never reports. Renaming this job
  # strands every pull request. `always()` because a skipped job never reports,
  # which a required check reads as missing rather than as passed.
  memory:
    name: memory
    needs: memory-shard
    if: ${{ always() && (github.event_name != 'schedule' || github.repository_owner == 'vaelii') }}
    runs-on: ubuntu-latest
    steps:
      - name: All memory shards green
        run: |
          [ "${{ needs.memory-shard.result }}" = "success" ]

  # The disk end of the durability axis, split across eight runner VMs. In run
  # 38451741321 the leg carried 2393s of namespace time against the memory leg's
  # 2383s, with the per-namespace figures correlating at r = 0.85, which is why
  # each leg packs from its own weights.
  disk-shard:
    name: disk-shard-${{ matrix.shard }}
    needs: weights-plan
    if: github.event_name != 'schedule' || github.repository_owner == 'vaelii'
    runs-on: ubuntu-latest
    # memory-shard's timeout, from the same figures
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74  # 13.7.0
        with:
          lein: 2.12.0  # 2.13.0's launcher self-installs an unpublished snapshot jar

      - name: Cache Maven deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-jdk25-${{ hashFiles('project.clj') }}
          restore-keys: |
            m2-${{ runner.os }}-jdk25-

      # Exactly the entry weights-plan found, and a miss fails the shard: a shard
      # falling back to the committed file while its siblings read the cache would
      # pack from different weights than they do.
      - name: Restore the cached weights
        if: needs.weights-plan.outputs.disk != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/ci-weights/disk.tsv
          key: ${{ needs.weights-plan.outputs.disk }}
          fail-on-cache-miss: true

      - name: Restore develop's weights
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/ci-baseline/
          key: ci-baseline-${{ github.run_id }}
          restore-keys: ci-baseline-

      - name: Run the suite (disk-log, shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        id: suite
        env:
          # `disk-log`: durable records under the write-ahead-logged index
          # (docs/storage.md) — the same end of the axis the retired single
          # `disk` leg ran.
          VAELII_TEST_BACKEND: disk-log
        run: |
          set -o pipefail
          export JVM_OPTS="-Dvaelii.disk.dir=$RUNNER_TEMP/vaelii-disk"
          mkdir -p target/ci/timings-disk
          w=(); [ -f target/ci-weights/disk.tsv ] && w=(--weights target/ci-weights/disk.tsv)
          nss=$(scripts/ci-shard.sh "${{ matrix.shard }}" "${{ strategy.job-total }}" --leg disk "${w[@]}")
          [ -n "$nss" ]
          . scripts/lib/ns-timings.sh
          t="target/ci/timings-disk/${{ matrix.shard }}-of-${{ strategy.job-total }}.tsv"
          log="target/ci/test-disk-shard-${{ matrix.shard }}.log"
          # shellcheck disable=SC2086
          lein test $nss 2>&1 | ns_timings "$t" | tee "$log"
          if [ -f target/ci-baseline/disk.tsv ]; then
            slow=$(scripts/ci-weights.sh --from target/ci/timings-disk --leg disk --list target/ci-baseline/disk.tsv) \
              || echo "::warning::scripts/ci-weights.sh --list failed, so no namespace runs again"
            # shellcheck disable=SC2086
            if ns_timings_rerun_fits target/ci-baseline/disk.tsv "$nss" $slow; then
              ns_timings_rerun "$t" $slow | tee -a "$log"
            fi
          fi

      - name: Upload failure logs
        if: failure() && steps.suite.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-disk-shard-${{ matrix.shard }}-logs
          path: target/ci/
          if-no-files-found: error
          retention-days: 7

      # A green shard's namespace times, for the `weights` job. A failed upload
      # costs the next run its balance, not this run its verdict.
      - name: Upload namespace timings
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: timings-disk-${{ matrix.shard }}
          path: target/ci/timings-disk/
          if-no-files-found: error
          retention-days: 1

  # Branch protection on `develop` requires the bare `disk` context, so the four
  # shard legs report through this required check rather than under their own names —
  # renaming it strands every pull request (the naming note on `memory` says
  # why). `always()` because a skipped job never reports, which a required
  # check reads as missing, not as passed.
  disk:
    name: disk
    needs: disk-shard
    if: ${{ always() && (github.event_name != 'schedule' || github.repository_owner == 'vaelii') }}
    runs-on: ubuntu-latest
    steps:
      - name: All disk shards green
        run: |
          [ "${{ needs.disk-shard.result }}" = "success" ]

  # A green leg's namespace times, averaged into the weights this run packed from
  # (scripts/lib/ns-timings.sh, `ns_timings_average`), become the weights the next
  # run packs from. The `-<attempt>` suffix gives a re-run its own key, since a
  # cache entry cannot be overwritten. scripts/ci-weights.sh refuses a set of
  # timing files missing a shard, so a re-run that downloads only some shards'
  # files saves nothing.
  #
  # The job then checks each green leg's times against develop's weights and goes
  # red when a namespace, or both legs, ran slower than the runners' speed accounts
  # for (scripts/ci-weights.sh, the --check form). Only a push to develop saves a
  # `ci-baseline-` entry, and a pull request reads its base branch's cache, so every
  # run of a pull request is judged against develop and not against its own earlier
  # runs, while a push to develop is judged against the push before it. The checks
  # follow both weight saves, so a red check still hands the next run its weights.
  # Not a required check: a red here names namespaces for a reviewer to read, and
  # blocks no merge.
  weights:
    name: weights
    needs: [weights-plan, memory-shard, disk-shard]
    if: ${{ always() && (needs.memory-shard.result == 'success' || needs.disk-shard.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download the memory timings
        if: needs.memory-shard.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: timings-memory-*
          path: target/ci/timings-memory
          merge-multiple: true
      - name: Restore the memory weights this run packed from
        if: needs.memory-shard.result == 'success' && needs.weights-plan.outputs.memory != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/ci-weights/memory.tsv
          key: ${{ needs.weights-plan.outputs.memory }}
      - name: Write the memory weights
        if: needs.memory-shard.result == 'success'
        run: |
          prev=target/ci-weights/memory.tsv
          [ -f "$prev" ] || prev=scripts/ci-test-weights-memory.tsv
          scripts/ci-weights.sh --from target/ci/timings-memory --leg memory --prev "$prev" --out target/ci-weights/memory.tsv
      - name: Save the memory weights
        if: needs.memory-shard.result == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/ci-weights/memory.tsv
          key: ci-weights-memory-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download the disk timings
        if: needs.disk-shard.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: timings-disk-*
          path: target/ci/timings-disk
          merge-multiple: true
      - name: Restore the disk weights this run packed from
        if: needs.disk-shard.result == 'success' && needs.weights-plan.outputs.disk != ''
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/ci-weights/disk.tsv
          key: ${{ needs.weights-plan.outputs.disk }}
      - name: Write the disk weights
        if: needs.disk-shard.result == 'success'
        run: |
          prev=target/ci-weights/disk.tsv
          [ -f "$prev" ] || prev=scripts/ci-test-weights-disk.tsv
          scripts/ci-weights.sh --from target/ci/timings-disk --leg disk --prev "$prev" --out target/ci-weights/disk.tsv
      - name: Save the disk weights
        if: needs.disk-shard.result == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/ci-weights/disk.tsv
          key: ci-weights-disk-${{ github.run_id }}-${{ github.run_attempt }}

      # No entry has the exact key, so the prefix finds the newest develop push's.
      # `!cancelled()` on every step from here: a red memory check still runs the disk
      # check and records the baseline.  A check exits 1 on a namespace finding, which
      # fails its step, and 3 on a slow leg alone, which fails the job only when both
      # legs exit 3 (the last step).  Run 42816741407 read the memory leg at 1.28
      # beside the disk leg at 0.92, over one tree.
      - name: Restore develop's weights
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/ci-baseline/
          key: ci-baseline-${{ github.run_id }}
          restore-keys: ci-baseline-
      - name: Check the memory times against develop's
        id: check-memory
        if: ${{ !cancelled() && needs.memory-shard.result == 'success' && hashFiles('target/ci-baseline/memory.tsv') != '' }}
        run: |
          set -o pipefail
          rc=0
          scripts/ci-weights.sh --from target/ci/timings-memory --leg memory \
            --check target/ci-baseline/memory.tsv | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" -ne 3 ] || echo "::warning::the memory leg ran slower than its runners' speed accounts for"
          [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]
      - name: Check the disk times against develop's
        id: check-disk
        if: ${{ !cancelled() && needs.disk-shard.result == 'success' && hashFiles('target/ci-baseline/disk.tsv') != '' }}
        run: |
          set -o pipefail
          rc=0
          scripts/ci-weights.sh --from target/ci/timings-disk --leg disk \
            --check target/ci-baseline/disk.tsv | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" -ne 3 ] || echo "::warning::the disk leg ran slower than its runners' speed accounts for"
          [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]
      # A red leg leaves no weights file, and keeps the baseline it restored.
      - name: Record this push's weights as develop's
        id: baseline
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        run: |
          mkdir -p target/ci-baseline
          for leg in memory disk; do
            if [ -f "target/ci-weights/$leg.tsv" ]; then
              cp "target/ci-weights/$leg.tsv" "target/ci-baseline/$leg.tsv"
            fi
          done
          [ -n "$(ls target/ci-baseline)" ]
      - name: Save develop's weights
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/ci-baseline/
          key: ci-baseline-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Fail when both legs ran slow
        if: ${{ !cancelled() && steps.check-memory.outputs.rc == '3' && steps.check-disk.outputs.rc == '3' }}
        run: |
          echo "ci-weights: both legs ran slower than their runners' speed accounts for" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

  # The suite again, with an ANSWER SET SOLVER on the box. Without one, eight
  # test namespaces skip their bodies and still report as passing — every solver
  # test is wrapped in `(when asp? …)`, so a run with no solver is green and
  # asserts nothing about the subsystem. The two legs above are exactly that run.
  # Measured: 120,261 assertions locally against 119,963 on a runner, same test
  # count, 298 assertions short, and the difference is entirely this.
  #
  # The two executables and not the library, and the reason is a supply problem
  # rather than a preference. The subprocess backend (`vaelii.impl.asp.clasp`)
  # takes ASPIF on stdin and runs `clasp` from PATH, or the executable
  # `VAELII_CLASP_BIN` names. `apt-get install clasp` supplies clasp: it is in
  # Ubuntu universe at 3.3.5. The clingo executable takes the same flags, and the
  # `clingo` pip wheel runs it as `python3 -m clingo`, so a two-line wrapper on PATH
  # supplies it, and the suite runs a second time through it. libclingo is loaded
  # in-process through raw JNA and needs `libclingo.so` on `jna.library.path`
  # (the `+with-clingo` profile, `VAELII_CLINGO_LIB`), and as of 2026-08-04 there
  # is **no Ubuntu package for it at any suite** — neither `clingo` nor
  # `libclingo` — and the `clingo` pip wheel ships `_clingo.cpython-*.so`, a
  # CPython extension module rather than the C library JNA would load. So the
  # routes left are building from source or conda-forge, both of which are more
  # than a step in this file. Checked, not assumed; do not retry `apt-get install
  # clingo` on the strength of it sounding plausible.
  #
  # The consequence for this job: it covers the ASPIF path, the subprocess
  # protocol on both executables and every solver-dependent test, and it does
  # **not** cover the JNA binding. That gap is real and is named in BEFORE_RELEASE_TODO §D.
  #
  # `VAELII_ASP_SOLVER=clasp` fixes the routing. In AUTO mode the engine picks
  # clingo for small programs and clasp for large ones, so a leg with no fixed solver would
  # silently change what it tests the day a runner image ships libclingo.
  #
  # The solver-dependent namespaces, not the whole `:default` selector. Ten namespaces
  # are conditional on the solver today — the four `asp_*`, plus labeling, solve-context,
  # koinii-schedule and the constraint / sudoku / tsp solve tests — and the other
  # 314 answer the same on this leg as on `memory`, which already ran them.
  #
  # A hand-written list goes stale, and this one had: the comment said "eight" while
  # the tree held ten. So the list is DERIVED — `scripts/asp-namespaces.sh`
  # greps `test/` for the solver availability call on every run, so a namespace that starts reading
  # `solver/available?` is covered the day it lands. `vaelii.asp-namespaces-test` checks the
  # same scan against a committed list, so the set changing is a red suite and a
  # diff a reviewer sees rather than a silent widening of what this job runs.
  #
  # Measured: the solver-dependent bodies are 298 assertions of the suite's 156,412, and the ten
  # namespaces run in 11s locally against 27.4 minutes for the whole suite — which is
  # what put this job over its 30-minute limit on 2026-09-04 (runs 33926520569,
  # 33930657662).
  asp:
    name: asp
    # as the shard legs above: scheduled runs only where the minutes are free
    if: github.event_name != 'schedule' || github.repository_owner == 'vaelii'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74  # 13.7.0
        with:
          lein: 2.12.0  # 2.13.0's launcher self-installs an unpublished snapshot jar

      - name: Cache Maven deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-jdk25-${{ hashFiles('project.clj') }}
          restore-keys: |
            m2-${{ runner.os }}-jdk25-

      # universe, enabled by default on ubuntu-latest.
      - name: Install clasp
        run: |
          sudo apt-get update
          sudo apt-get install -y clasp

      # THE STEP THIS JOB EXISTS FOR. Installing a solver and running the suite
      # proves nothing on its own: if the install half-fails, or the binary is not
      # on the PATH the JVM sees, `clasp/available?` is false, every solver test
      # skips exactly as it does on the other two legs, and this job goes green
      # having tested less than the job it was added to supplement.
      #
      # Asked of `clasp/available?` and not `solver/available?`, which is the
      # difference between checking that A solver is present and checking that
      # THIS one is: `solver/available?` is satisfied by whichever backend
      # answered, so it would pass on a runner that grew a libclingo and lost its
      # clasp. `clasp --version` runs first, to tell a missing package apart from
      # a package the JVM cannot see.
      - name: Assert clasp is reachable
        run: |
          clasp --version
          lein run -m clojure.main -e "(require '[vaelii.impl.asp.clasp :as clasp]) (when-not (clasp/available?) (System/exit 1))"
          echo "clasp/available? is true"

      # The wrapper is the one docs/asp.md's install table gives for pip. It is on PATH
      # as `clingo`, so the clasp run below also compares the two executables
      # (`asp_aspif_test/every-backend-answers-every-mode-alike`). The venv keeps pip off
      # the system Python, which Ubuntu marks externally managed.
      - name: Install the clingo executable (pip, behind a wrapper)
        run: |
          python3 -m venv "$RUNNER_TEMP/clingo-venv"
          "$RUNNER_TEMP/clingo-venv/bin/pip" install --quiet clingo==5.8.2
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec "%s/clingo-venv/bin/python3" -m clingo "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/bin/clingo"
          chmod +x "$RUNNER_TEMP/bin/clingo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Assert the clingo executable is reachable
        env:
          VAELII_CLASP_BIN: clingo
        run: |
          clingo --version
          lein run -m clojure.main -e "(require '[vaelii.impl.asp.clasp :as clasp]) (when-not (clasp/available?) (System/exit 1))"
          echo "the clingo executable answers"

      # The namespace-list test first and on its own: it is what says the list below is the
      # whole of what is conditional on the solver, so a scan that has stopped matching must
      # fail here rather than quietly hand `lein test` a short list.
      - name: The solver namespace list is current
        run: lein test vaelii.asp-namespaces-test

      - name: Run the solver-dependent namespaces (with clasp)
        id: suite
        env:
          VAELII_ASP_SOLVER: clasp
        run: |
          set -o pipefail
          mkdir -p target/ci
          namespaces="$(./scripts/asp-namespaces.sh | tr '\n' ' ')"
          echo "solver-dependent namespaces: $namespaces"
          [ -n "$namespaces" ]
          lein test $namespaces 2>&1 | tee target/ci/test-asp.log

      - name: Run the solver-dependent namespaces (with the clingo executable)
        id: suite-clingo
        env:
          VAELII_ASP_SOLVER: clasp
          VAELII_CLASP_BIN: clingo
        run: |
          set -o pipefail
          namespaces="$(./scripts/asp-namespaces.sh | tr '\n' ' ')"
          [ -n "$namespaces" ]
          lein test $namespaces 2>&1 | tee target/ci/test-asp-clingo.log

      - name: Upload failure logs
        if: failure() && (steps.suite.outcome == 'failure' || steps.suite-clingo.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-asp-logs
          path: target/ci/
          if-no-files-found: error
          retention-days: 7
