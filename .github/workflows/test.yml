name: test

# The suite, once per RECORD store. Storage is two independent choices
# (docs/storage.md) and there are seven legal record×index pairs plus the
# overlay decorator, but a pull request does not need all eight: the axis a
# change is most likely to break and least likely to notice is DURABILITY, so
# the gate runs the two ends of it — everything in RAM, and everything on disk —
# and deep.yml carries the full matrix. `scripts/test-backends.sh` is the
# same eight runs locally, and anything touching storage, the index, records or
# recovery owes it one before it lands.
#
# The `:default` selector, matching `lein gate`. The twenty `^:slow` tests
# carry 118k of the suite's 238k assertions and take a memory run from 219s to
# 317s; deferring them here is only honest because deep.yml runs `:all`. If
# that job is ever removed, this one has to become `:all`.
#
# BOTH LEGS ARE SHARDED ACROSS RUNNER VMs, the memory leg three ways and the
# disk-log leg four. In run 33979380791 the memory leg ran 24m08s in one job and
# the slower of the two disk jobs 17m48s, both against a 30-minute timeout. Split
# this way each memory runner carries 467s of namespaces and each disk runner
# 438s, and the workflow answers in about nine minutes. This is not the same-host
# JVM sharding scripts/test-parallel.sh refuses for durable backends — separate
# VMs share neither a disk nor a registry, the same reason deep.yml runs nine
# backends in parallel. Shards are whole namespaces (a `:once` fixture is what
# tests in one file share), and `scripts/ci-shard.sh` decides which namespaces
# each shard gets: it packs them by measured time, because an equal count of
# files is not an equal amount of work. The alphabetical halves it replaced put
# 752s on one disk runner and 1060s on the other.
#
# The shard COUNT is the length of each job's matrix, read back as
# `strategy.job-total`. Both matrices have one dimension, so adding a value to
# `shard:` is the whole of adding a shard.
#
# Hermetic: no external service, no network call, and no LLM. `^:llm` is the one
# mark `:all` does not select, and reaching a provider additionally needs
# VAELII_LLM_LIVE=1, which is not set here and must never be.
#
# Every `uses:` below is a commit SHA with the version in a trailing comment;
# lint.yml's header says why a tag is not good enough here.
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

# Least privilege: these jobs read the repo and run the suite. Nothing is
# written back and no secret is read, so a fork's pull request runs the whole
# thing — which is the point. `pull_request`, never `pull_request_target`.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The in-RAM end of the durability axis, split across three runner VMs, each
  # reporting under its own name and all three gated by the `memory` job below.
  #
  # `memory` and `disk` are REQUIRED checks on `develop`, and what makes that
  # safe is that this workflow carries no path filter: it runs on every pull
  # request, so both gates always report. DO NOT ADD A `paths-ignore` here. A
  # workflow skipped by a path filter never reports at all — not as passed,
  # not as skipped — so a required check that names it leaves every pull
  # request the filter matched unmergeable forever. The two are one decision.
  #
  # A doc-only change runs the suite and passes it, and that is the price of
  # the gate being a gate rather than a reading. `docs/**` is not inert with
  # respect to the suite anyway: config_surface_test reads docs/operations.md
  # and holds its configuration table to every switch the tree reads, and
  # scripts/check-doc-drift.py stands aside on that one file because the test
  # covers it.
  memory-shard:
    name: memory-shard-${{ matrix.shard }}
    # A scheduled run does work only where Actions minutes are free. Push and
    # pull_request are untouched: this job is the gate, and a gate that skips is
    # not one. deep.yml carries the long form of the argument.
    if: github.event_name != 'schedule' || github.repository_owner == 'vaelii'
    runs-on: ubuntu-latest
    # Twice the 8m50s a balanced shard is predicted to take. A shard that grows
    # into this has grown by more than 100%, which is a change to investigate
    # rather than a slow runner to wait out.
    timeout-minutes: 20
    strategy:
      # Run every shard to completion: a bug living in one shard's namespaces
      # should not be hidden by another shard going red first.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # No credentials left in .git/config: nothing here pushes, and a token
      # sitting in the workspace is reachable by anything the build runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d  # 13.6.1
        with:
          lein: 2.12.0  # 2.13.0's launcher self-installs an unpublished snapshot jar

      - name: Cache Maven deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2
          # runner OS and JDK in the key: the same project.clj resolves different
          # artifacts on a different platform or Java version, and a bare `m2-`
          # key would serve one leg's ~/.m2 to another the moment a matrix grows.
          key: m2-${{ runner.os }}-jdk21-${{ hashFiles('project.clj') }}
          restore-keys: |
            m2-${{ runner.os }}-jdk21-

      # The suite owns space numbers 14-15 and clears them; the foreign-reader
      # plugin owns 8-11, which is what lets both run at once on one machine.
      # Nothing is set here because each shard is its own runner VM, so the
      # default block is already unshared — the convention matters to a developer
      # running two suites locally, and `VAELII_TEST_SPACE` is how they move it.
      #
      # A RAM-only run reads no directory and is given no `-D` at all; the
      # disk-log shards below point `vaelii.disk.dir` at scratch space of their
      # own. Same shape as scripts/test-backends.sh, the local spelling of this.
      #
      # `tee` so the run streams into the job log AND leaves a file for the
      # upload below — `lein test` writes no log of its own (`lein gate` is what
      # fills target/gate/, and this job does not run it). `set -o pipefail` is
      # what keeps the pipe honest: without it the step's status is `tee`'s,
      # which is always 0, so a red suite would report green.
      #
      # `$nss` is unquoted because the shard script prints a namespace per line
      # and `lein test` wants them as separate arguments.
      - name: Run the suite (memory, shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        id: suite
        env:
          VAELII_TEST_BACKEND: memory
        run: |
          set -o pipefail
          mkdir -p target/ci
          nss=$(scripts/ci-shard.sh "${{ matrix.shard }}" "${{ strategy.job-total }}")
          [ -n "$nss" ]
          # Bare namespace args: the `:default` selector still applies (verified:
          # a ^:slow test in a named namespace is excluded), while spelling the
          # selector out alongside namespace args makes lein ignore the namespace
          # filter and run the whole suite (verified the hard way).
          # shellcheck disable=SC2086
          lein test $nss 2>&1 | tee "target/ci/test-memory-shard-${{ matrix.shard }}.log"

      # The log is the answer to "why did it fail", and a red run is exactly when
      # nobody can reproduce it locally. `if: failure()` so a green run uploads
      # nothing; `if-no-files-found: error` because an empty artifact answers
      # nothing and reads as if it had — the step above writes the file, so its
      # absence is a defect in this job rather than a normal outcome.
      #
      # Conditioned on the SUITE step rather than on the job, so a failure in
      # checkout or setup — which never reaches the log — skips the upload
      # instead of failing it a second time for a file that was never written.
      - name: Upload failure logs
        if: failure() && steps.suite.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-memory-shard-${{ matrix.shard }}-logs
          path: target/ci/
          if-no-files-found: error
          retention-days: 7

  # Branch protection on `develop` requires the bare `memory` context, so the
  # shard legs report through this gate rather than under their own names.
  # Branch protection stores the JOB name, so the context is the bare `memory` —
  # the `test / memory` spelling is the pull-request UI's, and typing that into a
  # required-checks list names a check that never reports. Renaming this job
  # strands every pull request. `always()` because a skipped job never reports,
  # which a required check reads as missing rather than as passed.
  memory:
    name: memory
    needs: memory-shard
    if: ${{ always() && (github.event_name != 'schedule' || github.repository_owner == 'vaelii') }}
    runs-on: ubuntu-latest
    steps:
      - name: All memory shards green
        run: |
          [ "${{ needs.memory-shard.result }}" = "success" ]

  # The disk end of the durability axis, split across four runner VMs. The leg
  # carries more namespace time than the memory one — 1752s against 1388s over
  # the same 320 namespaces, the same work through a durable record store — so it
  # is split one way further to keep the two legs finishing together.
  disk-shard:
    name: disk-shard-${{ matrix.shard }}
    if: github.event_name != 'schedule' || github.repository_owner == 'vaelii'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d  # 13.6.1
        with:
          lein: 2.12.0  # 2.13.0's launcher self-installs an unpublished snapshot jar

      - name: Cache Maven deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-jdk21-${{ hashFiles('project.clj') }}
          restore-keys: |
            m2-${{ runner.os }}-jdk21-

      - name: Run the suite (disk-log, shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        id: suite
        env:
          # `disk-log`: durable records under the write-ahead-logged index
          # (docs/storage.md) — the same end of the axis the retired single
          # `disk` leg ran.
          VAELII_TEST_BACKEND: disk-log
        run: |
          set -o pipefail
          export JVM_OPTS="-Dvaelii.disk.dir=$RUNNER_TEMP/vaelii-disk"
          mkdir -p target/ci
          nss=$(scripts/ci-shard.sh "${{ matrix.shard }}" "${{ strategy.job-total }}")
          [ -n "$nss" ]
          # shellcheck disable=SC2086
          lein test $nss 2>&1 | tee "target/ci/test-disk-shard-${{ matrix.shard }}.log"

      - name: Upload failure logs
        if: failure() && steps.suite.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-disk-shard-${{ matrix.shard }}-logs
          path: target/ci/
          if-no-files-found: error
          retention-days: 7

  # Branch protection on `develop` requires the bare `disk` context, so the four
  # shard legs report through this gate rather than under their own names —
  # renaming it strands every pull request (the naming note on `memory` says
  # why). `always()` because a skipped job never reports, which a required
  # check reads as missing, not as passed.
  disk:
    name: disk
    needs: disk-shard
    if: ${{ always() && (github.event_name != 'schedule' || github.repository_owner == 'vaelii') }}
    runs-on: ubuntu-latest
    steps:
      - name: All disk shards green
        run: |
          [ "${{ needs.disk-shard.result }}" = "success" ]

  # The suite again, with an ANSWER SET SOLVER on the box. Without one, eight
  # test namespaces skip their bodies and still report as passing — every solver
  # test is wrapped in `(when asp? …)`, so a run with no solver is green and
  # asserts nothing about the subsystem. The two legs above are exactly that run.
  # Measured: 120,261 assertions locally against 119,963 on a runner, same test
  # count, 298 assertions short, and the difference is entirely this.
  #
  # `clasp` and not `clingo`, and the reason is a supply problem rather than a
  # preference — both backends deserve a leg, and only one of them can have a
  # cheap one. clasp is a subprocess taking ASPIF on stdin
  # (`vaelii.impl.asp.clasp`), found by name on PATH, so `apt-get install clasp`
  # is the whole story: it is in Ubuntu universe at 3.3.5. clingo is loaded
  # in-process through raw JNA and needs `libclingo.so` on `jna.library.path`
  # (the `+with-clingo` profile, `VAELII_CLINGO_LIB`), and as of 2026-08-04 there
  # is **no Ubuntu package for it at any suite** — neither `clingo` nor
  # `libclingo` — and the `clingo` pip wheel ships `_clingo.cpython-*.so`, a
  # CPython extension module rather than the C library JNA would load. So the
  # routes left are building from source or conda-forge, both of which are more
  # than a step in this file. Checked, not assumed; do not retry `apt-get install
  # clingo` on the strength of it sounding plausible.
  #
  # The consequence for this job: it covers the ASPIF path, the subprocess
  # protocol and every solver-gated test, and it does **not** cover the JNA
  # binding. That gap is real and is named in BEFORE_RELEASE_TODO §D.
  #
  # `VAELII_ASP_SOLVER=clasp` pins the routing. In AUTO mode the engine picks
  # clingo for small programs and clasp for large ones, so an unpinned leg would
  # silently change what it tests the day a runner image ships libclingo.
  #
  # The solver-gated namespaces, not the whole `:default` selector. Ten namespaces
  # gate on the solver today — the four `asp_*`, plus labeling, solve-context,
  # koinii-schedule and the constraint / sudoku / tsp solve tests — and the other
  # 314 answer the same on this leg as on `memory`, which already ran them.
  #
  # A hand-written list goes stale, and this one had: the comment said "eight" while
  # the tree held ten. So the list is DERIVED — `scripts/asp-namespaces.sh`
  # greps `test/` for the gate on every run, so a namespace that starts reading
  # `solver/available?` is covered the day it lands. `vaelii.asp-roster-test` pins the
  # same scan against a committed roster, so the set changing is a red suite and a
  # diff a reviewer sees rather than a silent widening of what this job runs.
  #
  # Measured: the gated bodies are 298 assertions of the suite's 156,412, and the ten
  # namespaces run in 11s locally against 27.4 minutes for the whole suite — which is
  # what put this job over its 30-minute limit on 2026-09-04 (runs 33926520569,
  # 33930657662).
  asp:
    name: asp
    # as the shard legs above: scheduled runs only where the minutes are free
    if: github.event_name != 'schedule' || github.repository_owner == 'vaelii'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d  # 13.6.1
        with:
          lein: 2.12.0  # 2.13.0's launcher self-installs an unpublished snapshot jar

      - name: Cache Maven deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-jdk21-${{ hashFiles('project.clj') }}
          restore-keys: |
            m2-${{ runner.os }}-jdk21-

      # universe, enabled by default on ubuntu-latest.
      - name: Install clasp
        run: |
          sudo apt-get update
          sudo apt-get install -y clasp

      # THE STEP THIS JOB EXISTS FOR. Installing a solver and running the suite
      # proves nothing on its own: if the install half-fails, or the binary is not
      # on the PATH the JVM sees, `clasp/available?` is false, every solver test
      # skips exactly as it does on the other two legs, and this job goes green
      # having tested less than the job it was added to supplement.
      #
      # Asked of `clasp/available?` and not `solver/available?`, which is the
      # difference between checking that A solver is present and checking that
      # THIS one is: `solver/available?` is satisfied by whichever backend
      # answered, so it would pass on a runner that grew a libclingo and lost its
      # clasp. `clasp --version` runs first, to tell a missing package apart from
      # a package the JVM cannot see.
      - name: Assert clasp is reachable
        run: |
          clasp --version
          lein run -m clojure.main -e "(require '[vaelii.impl.asp.clasp :as clasp]) (when-not (clasp/available?) (System/exit 1))"
          echo "clasp/available? is true"

      # The roster test first and on its own: it is what says the list below is the
      # whole of what gates on the solver, so a scan that has stopped matching must
      # fail here rather than quietly hand `lein test` a short list.
      - name: The solver-gated roster is current
        run: lein test vaelii.asp-roster-test

      - name: Run the solver-gated namespaces (with clasp)
        id: suite
        env:
          VAELII_ASP_SOLVER: clasp
        run: |
          set -o pipefail
          mkdir -p target/ci
          namespaces="$(./scripts/asp-namespaces.sh | tr '\n' ' ')"
          echo "solver-gated namespaces: $namespaces"
          [ -n "$namespaces" ]
          lein test $namespaces 2>&1 | tee target/ci/test-asp.log

      - name: Upload failure logs
        if: failure() && steps.suite.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-asp-logs
          path: target/ci/
          if-no-files-found: error
          retention-days: 7
