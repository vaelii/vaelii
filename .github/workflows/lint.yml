name: lint

# Static analysis, and the doc checks that go with it — `lein lint`, which is
# scripts/lint.sh: glossary structure, relative-link resolution, doc/code drift,
# clj-kondo, cljfmt, shellcheck, and the two ratchets — a compile pass whose
# reflection warnings fail, and a public var nothing references. One job, because
# the script already runs every check and is deliberately NOT fail-fast: splitting
# them would cost a JVM boot each to learn what one run already knows, and would
# lose the report.
#
# The two ratchets add about fifteen seconds between them, and the compile pass is
# most of it — it is a real `lein check`, so it wants the JDK and the resolved
# classpath this job already pays for. The `reflect` row here covers src and bench;
# the test tree's half of that check runs in `lein gate`'s test stage, which is
# test.yml's business (scripts/check-reflection.sh states the split).
#
# Nothing here needs a KB, a backend or a network call. This required check
# answers "is the tree well-formed" while test.yml answers "is it right".
# Both are required on `develop` and both run on every pull request, so a README
# edit is checked by the doc checks here rather than by anything the suite
# asserts. One exception: check-doc-drift.py exempts docs/operations.md from W1
# because config_surface_test resolves those citations instead, so the suite checks
# that file and this workflow does not.
#
# EVERY `uses:` IN THIS REPO'S WORKFLOWS IS A COMMIT SHA, with the version in a
# trailing comment — here, in test.yml and in deep.yml. A tag is a mutable ref
# that the action's owner (or anyone who takes that account) can repoint, and
# `v6` moves by design; these workflows run fork pull requests with actions
# unrestricted, so a tag is a supply-chain promise made by somebody else's
# account. A SHA is the artifact itself. The trailing comment is not decoration:
# Dependabot reads it, and its bump PRs carry the version the new SHA is.
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

# Least privilege: this job reads the repo and runs analysis. It never writes
# back, and it touches no secret — so a fork's pull request runs it in full.
permissions:
  contents: read

# Supersede a pull request's older runs, never a push or the canary: cancelling
# a push run would leave main's last commit with no verdict at all.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    # A scheduled run does work only where Actions minutes are free. deep.yml
    # carries the long form of the argument.
    if: github.event_name != 'schedule' || github.repository_owner == 'vaelii'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No credentials left in .git/config: nothing here pushes, and a token
      # sitting in the workspace is reachable by anything the build runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      # kondo runs as a standalone binary, not through lein — `lein lint-kondo`
      # shells out to it — so this action installs both. Two fixed versions, and both
      # matter: the action is a SHA (the header says why), and `clj-kondo:`
      # names a version rather than taking the default, which is *latest* — so
      # a kondo release cannot turn this workflow red with no change in this
      # repository. Installing a linter is also the step with the widest reach
      # in this job: it puts a binary on the PATH that then reads the tree.
      - name: Set up Leiningen and clj-kondo
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74  # 13.7.0
        with:
          lein: 2.12.0  # 2.13.0's launcher self-installs an unpublished snapshot jar
          clj-kondo: 2026.08.04

      - name: Cache Maven deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2
          # runner OS and JDK in the key: the same project.clj resolves different
          # artifacts on a different platform or Java version, and a bare `m2-` key
          # would serve one leg's ~/.m2 to another the moment a matrix grows.
          key: m2-${{ runner.os }}-jdk25-${{ hashFiles('project.clj') }}
          # Partial-restore on a project.clj bump instead of a full re-download.
          restore-keys: |
            m2-${{ runner.os }}-jdk25-

      # shellcheck and python3 are preinstalled on ubuntu-latest; lint.sh names
      # what it needs and fails the check with an install hint if one is absent,
      # so a runner image that drops one reports it rather than skipping it.
      #
      # The whole report in one command, so CI and a local run cannot diverge:
      # `lein lint` here is the same `lein lint` a contributor runs, and its exit
      # status is already non-zero iff any check failed.
      - name: Lint
        run: lein lint
