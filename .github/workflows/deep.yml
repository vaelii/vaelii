name: deep

# The deep run: everything the pull-request gate defers.
#
# Named for what it does rather than when it runs, so a change of cadence is not
# a rename. It runs weekly: nine backends at `:all` is ~130 billed minutes and
# the six sweeps add ~95 more, so a run is a few billed hours — and a tree that
# changes a few times a week does not have a fresh answer every day. Running it
# daily would buy six identical verdicts and turn one real failure into six lines
# of noise. Wall clock is ~20 minutes either way, since the legs are parallel;
# what the cadence is protecting is the minutes, not the wait.
#
# test.yml runs the `:default` selector on two of the nine backends, because a
# contributor should not wait an hour for a verdict. That leaves five real gaps,
# and this workflow is all five of them:
#
#   - **The `^:slow` half of the suite.** Thirty-two tests carry 78k of the
#     suite's 280k assertions — the exhaustive cross-products and the randomized
#     oracles. `lein gate` skips them, test.yml skips them, and a mark that
#     defers a test is only honest if something eventually runs it. This is that
#     something.
#   - **The other seven backends.** Eight legal record×index pairs plus the
#     overlay decorator, and the suite is expected to be failing-set-identical
#     across all nine — a backend that answers differently is a bug in the
#     backend. The pull-request gate exercises two of the nine.
#   - **The six alternative implementations.** The persistent-map JTMS, the incremental
#     matcher, the node query engine, its tacticians, the reference retrieval
#     fan-out and the planner turned off. Each is selected by an env var
#     `test_util.clj` reads, each must be
#     failing-set-identical with the default it replaces, and nothing ran any of
#     them until the `sweeps` job below — see its own comment.
#   - **The cross-process tests.** `^:multi-jvm` is opt-in rather than deferred:
#     no selector reaches it, not even `:all`, so this job is not a second
#     opinion the way the three above are — it is the only thing that runs them.
#     They are where the single-writer lock's other-JVM branch, the OS dropping
#     a killed writer's lock, and a cold open over another process's directory
#     are checked, none of which one JVM can stage.
#   - **The exhaustive truncation sweep.** `^:fuzz` is opt-in for a third
#     reason, neither cost nor a process boundary: one JVM can stage it and
#     `:all` could reach it, but no configuration meaningfully varies it — the
#     sweep names its own four durable backends and never asks for the one the
#     row is testing, so a matrix row repeats work rather than asking a new
#     question. Once, not once per row, and here is the once. Nothing else runs
#     it at all: no gate, no script, no other alias — so this job is what stands
#     between the sweep and never running.
#
# **Informational, never a required check.** Nothing here blocks a merge: these
# jobs are long, the perf one is a timing measurement on a shared runner, and a
# gate a maintainer routinely overrides is not a gate. A failure here is a bug
# report addressed to the maintainer, which is why the artifacts are uploaded.
#
# Every `uses:` below is a commit SHA with the version in a trailing comment;
# lint.yml's header says why a tag is not good enough here.
on:
  schedule:
    # Sundays 04:00 UTC. A whole day clear of the Mon 08:00 canary on lint and
    # test, so a Monday morning never starts eleven runners at once, and it
    # lands before the week rather than after it — a failure is waiting when you
    # sit down, not discovered next Saturday.
    - cron: '0 4 * * 0'
  workflow_dispatch:

# Every job below repeats one condition, spelled out rather than named once,
# because a job-level `if` cannot read `env:` and there is nowhere else to put
# it. What it says: **this workflow does work only where Actions minutes are
# free.** GitHub bills private repositories and does not bill public ones, this
# file is identical in every repository that holds it, and one run of this
# workflow is 240 job-minutes against a 2,000-minute monthly allowance — so an
# unguarded run is most of a month's budget spent re-answering, on a copy
# nobody reads, what the free copy answers for nothing.
#
# **Every trigger is gated, dispatch included**, and that is the part worth
# being deliberate about: a dispatch is somebody asking, but asking on a billed
# copy spends the allowance the same way the cron would, and the ask is nearly
# always for an answer the free copy can give. Dispatch this workflow in the
# public repository; the two matrices it runs are `lein test-backends` and
# `lein test-sweeps` locally, which is where .claude/rules/workflow.md puts the
# gate anyway — this job is the confirmation, and a confirmation is not worth a
# month of minutes.
#
# The skip is silent by construction: a job whose `if` is false reports success,
# so a run started on a billed copy goes green having done nothing. That is the
# intended reading — "nothing to see here, ask the free copy" — and it is why
# the condition is on every job rather than on the workflow.

permissions:
  contents: read

# No cancel-in-progress: a scheduled deep run has no successor to be superseded
# by, and a manual dispatch while one is running is usually a deliberate re-run.
concurrency:
  group: deep-${{ github.ref }}

jobs:
  backends:
    name: ${{ matrix.backend }} (:all)
    # this workflow does work only where the minutes are free (see above `jobs:`)
    if: github.repository_owner == 'vaelii'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Every backend reports, whatever the others did. The question this job
      # answers is *which* backends differ, and fail-fast would answer it with
      # "at least one".
      fail-fast: false
      matrix:
        # The eight legal record×index pairs (`<records>-<index>`), then the
        # overlay decorator — which is not a ninth pair but the fork over an
        # empty base, the claim that a fork of nothing behaves like the thing it
        # forked. RAM records under a durable index is refused and has no name.
        backend:
          - memory
          - memory-dense
          - memory-columnar
          - disk-memory
          - disk-dense
          - disk-columnar
          - disk-snapshot
          - disk-log
          - overlay
    steps:
      # No credentials left in .git/config: nothing here pushes, and a token
      # sitting in the workspace is reachable by anything the build runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74  # 13.7.0
        with:
          lein: 2.12.0  # 2.13.0's launcher self-installs an unpublished snapshot jar

      - name: Cache Maven deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2
          # runner OS and JDK in the key: the same project.clj resolves different
          # artifacts on a different platform or Java version, and a bare `m2-`
          # key would serve one leg's ~/.m2 to another the moment a matrix grows.
          key: m2-${{ runner.os }}-jdk21-${{ hashFiles('project.clj') }}
          restore-keys: |
            m2-${{ runner.os }}-jdk21-

      # One backend per runner, so the script's own reason for running its nine
      # sequentially does not apply: two durable suites collide on the
      # single-writer lock and `VAELII_TEST_SPACE` admits only three
      # non-overlapping blocks, but separate VMs share neither a disk nor a
      # registry. Nine in parallel is ~20 minutes instead of ~3 hours, and on a
      # public repo the minutes are unmetered.
      - name: Suite (${{ matrix.backend }}, :all)
        run: ./scripts/test-backends.sh :all ${{ matrix.backend }}

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: deep-${{ matrix.backend }}
          path: target/test-backends/
          if-no-files-found: ignore
          retention-days: 14

  # The other axis the suite can be run on, and until now the one nothing ran.
  #
  # `VAELII_TEST_BACKEND` is not the only switch `test_util.clj` reads. Six more
  # re-run the whole suite through an *alternative implementation* of something
  # the engine otherwise picks for itself, and each is the same claim the backend
  # matrix makes: these must be failing-set-identical, because every one of them
  # is a cost decision rather than a semantic one. A tactician orders goals; it
  # does not choose answers.
  #
  # One bounded exception, and the suite carries it rather than this comment
  # waving at it: the node engine agrees with the DFS on the answer *set* and not
  # on how many derivations deliver it (docs/inference.md, and `inference/step!`
  # keys a `seen` set on the bindings). So the handful of assertions that count
  # `prove`'s results stand aside under `VAELII_QUERY_ENGINE`, through
  # `tu/query-engine-override`, and everything about the answer set runs under
  # both. An assertion standing aside says why, every time.
  #
  # The backends job crosses none of them — it varies storage and leaves all six
  # at their defaults — so before this job existed the reference implementations
  # were never run anywhere. That is not a hypothetical gap: running them by hand
  # found two real defects, one of them a genuine engine bug (a clash reported
  # against a different sentex depending on which retrieval path answered, since
  # `res/*hierarchical-retrieval*` promises the answer *set* and a caller was
  # reading the first element of it).
  #
  # On the DEFAULT backend only, and deliberately not crossed with the nine: the
  # dimensions are independent by construction, so the product buys 54 runs to
  # re-answer what 6 and 9 already answer separately.
  sweeps:
    name: ${{ matrix.name }} (:all)
    # this workflow does work only where the minutes are free (see above `jobs:`)
    if: github.repository_owner == 'vaelii'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Same reason as the backends job: the question is *which* dimension
      # diverged, and fail-fast answers "at least one".
      fail-fast: false
      matrix:
        include:
          - name: tms-reference
            env: VAELII_TEST_TMS=reference
          - name: rete
            env: VAELII_RETE=1
          - name: query-engine
            env: VAELII_QUERY_ENGINE=inference
          # only meaningful beside the node engine — the DFS has one order and
          # ignores the variable, so setting it alone would run the default twice
          - name: tactician
            env: VAELII_QUERY_ENGINE=inference VAELII_QUERY_STRATEGY=breadth-first
          - name: hier-off
            env: VAELII_HIER=0
          - name: plan-off
            env: VAELII_PLAN=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74  # 13.7.0
        with:
          lein: 2.12.0  # 2.13.0's launcher self-installs an unpublished snapshot jar

      - name: Cache Maven deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-jdk21-${{ hashFiles('project.clj') }}
          restore-keys: |
            m2-${{ runner.os }}-jdk21-

      # Plain `lein test`, not `test-backends.sh`: that script's whole job is to
      # loop the backend axis and reduce each run to a ✔/✘, which is why a failure
      # there has to be fetched from an artifact. One run on one axis has no loop
      # to reduce, so let the failures land in the job log where they are read.
      #
      # `env` as a command prefix rather than a `with: env:` block, because a
      # matrix leg needs two variables and one needs none of the other's.
      - name: Suite (${{ matrix.name }}, :all)
        run: env ${{ matrix.env }} lein test :all

  multi-jvm:
    name: multi-jvm
    # this workflow does work only where the minutes are free (see above `jobs:`)
    if: github.repository_owner == 'vaelii'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No credentials left in .git/config: nothing here pushes, and a token
      # sitting in the workspace is reachable by anything the build runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74  # 13.7.0
        with:
          lein: 2.12.0  # 2.13.0's launcher self-installs an unpublished snapshot jar

      - name: Cache Maven deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2
          # runner OS and JDK in the key: the same project.clj resolves different
          # artifacts on a different platform or Java version, and a bare `m2-`
          # key would serve one leg's ~/.m2 to another the moment a matrix grows.
          key: m2-${{ runner.os }}-jdk21-${{ hashFiles('project.clj') }}
          restore-keys: |
            m2-${{ runner.os }}-jdk21-

      # The cross-process tests. `:multi-jvm` is opt-in — no other selector
      # reaches them, so unlike every other job here this one is not a second
      # opinion on something the pull-request path already ran. If this job is
      # removed, nothing runs these at all.
      #
      # No classpath step: a child inherits `java.class.path` from the test JVM,
      # which leiningen has already resolved. Shelling out to `lein classpath`
      # per test would charge each one a dependency resolution.
      - name: Cross-process suite
        run: lein test-multi-jvm

  fuzz:
    name: fuzz
    # this workflow does work only where the minutes are free (see above `jobs:`)
    if: github.repository_owner == 'vaelii'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No credentials left in .git/config: nothing here pushes, and a token
      # sitting in the workspace is reachable by anything the build runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74  # 13.7.0
        with:
          lein: 2.12.0  # 2.13.0's launcher self-installs an unpublished snapshot jar

      - name: Cache Maven deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2
          # runner OS and JDK in the key: the same project.clj resolves different
          # artifacts on a different platform or Java version, and a bare `m2-`
          # key would serve one leg's ~/.m2 to another the moment a matrix grows.
          key: m2-${{ runner.os }}-jdk21-${{ hashFiles('project.clj') }}
          restore-keys: |
            m2-${{ runner.os }}-jdk21-

      # The exhaustive truncation sweep. `:fuzz` is opt-in like `:multi-jvm`, so
      # this job is the only thing that runs it — but for a different reason: it
      # is not that one JVM cannot stage the test, it is that no configuration
      # varies it. The sweep names its own four backends and reads no switch, so
      # running it on a second matrix row buys a second identical answer.
      #
      # `/dev/shm` is what makes twenty minutes a budget rather than a squeeze. A
      # probe's cost is one device cache flush, so on the runner's disk the sweep
      # is ~10 minutes and on tmpfs a couple; most of what is left goes on
      # compiling the test tree, which `lein test` does in full whatever it then
      # selects. The scratch space is free here and needs a RAM disk on macOS,
      # which is why the variable exists rather than the test simply choosing.
      - name: Truncation sweep
        run: VAELII_TEST_TMPDIR=/dev/shm lein test-fuzz

  perf:
    name: perf
    # this workflow does work only where the minutes are free (see above `jobs:`)
    if: github.repository_owner == 'vaelii'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # No credentials left in .git/config: nothing here pushes, and a token
      # sitting in the workspace is reachable by anything the build runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74  # 13.7.0
        with:
          lein: 2.12.0  # 2.13.0's launcher self-installs an unpublished snapshot jar

      - name: Cache Maven deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.m2
          # runner OS and JDK in the key: the same project.clj resolves different
          # artifacts on a different platform or Java version, and a bare `m2-`
          # key would serve one leg's ~/.m2 to another the moment a matrix grows.
          key: m2-${{ runner.os }}-jdk21-${{ hashFiles('project.clj') }}
          restore-keys: |
            m2-${{ runner.os }}-jdk21-

      # `lein perf` measures GROWTH RATIOS, not milliseconds, which is what
      # makes it runnable on a shared runner at all: a noisy neighbour slows
      # both sizes and the ratio survives. It is still noisier here than on a
      # quiet laptop, hence the raised tolerance — and hence "informational".
      # A regression this job reports is a lead, and `lein perf` locally is the
      # confirmation.
      #
      # `--tolerance` MULTIPLIES each bound (1.5 on a noisy box, 1.0 in anger),
      # so a number below 1 tightens the gate rather than loosening it. A shared
      # two-core runner is the noisy box the flag was written for.
      - name: Scaling claims
        run: lein perf --tolerance 1.5
